<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compression / Decompression — Aunt Man Microservices</title>
    <link rel="icon" type="image/png" href="../Resources/images/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header id="Page_Title">
        <a href="/" style="color:#9966cc;text-decoration:none;font-size:12px;margin-right:16px;font-family:'Courier New',monospace;">&#8592; Back</a>
        <b>Compression / Decompression</b>
    </header>
    <hr>
    <br>

    <div class="Upload_File_Form">
        <input type="file" id="Upload_File" hidden>
        <label for="Upload_File" class="Custom_File_Upload" id="Upload_Label"> Click or Drag <br> to Upload File</label>

        <div style="display:flex;gap:12px;justify-content:center;margin-top:12px;">
            <input type="button" id="Compress_Button"   value="Compress"   class="action-btn">
            <input type="button" id="Decompress_Button" value="Decompress" class="action-btn">
        </div>
    </div>

    <div id="status" style="text-align:center;font-family:'Courier New',monospace;font-size:13px;color:#aaaacc;margin-top:16px;"></div>
    <div id="result" style="text-align:center;margin-top:12px;"></div>

    <div id="instructions">
        <ol>
            <li>Click or drag a file into the upload area to select it.</li>
            <li>Click <b>Compress</b> to compress the file — downloads as <code>filename.zip</code>.</li>
            <li>Click <b>Decompress</b> to decompress a previously compressed <code>.zip</code> file.</li>
        </ol>
    </div>

    <script>
        const fileInput      = document.getElementById('Upload_File');
        const uploadLabel    = document.getElementById('Upload_Label');
        const statusDiv      = document.getElementById('status');
        const resultDiv      = document.getElementById('result');
        const compressBtn    = document.getElementById('Compress_Button');
        const decompressBtn  = document.getElementById('Decompress_Button');

        // Update label text when a file is chosen
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            uploadLabel.innerHTML = file ? file.name : 'Click or Drag <br> to Upload File';
            resultDiv.innerHTML = '';
            statusDiv.textContent = '';
        });

        // Drag-and-drop support
        uploadLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadLabel.classList.add('drag-over');
        });
        uploadLabel.addEventListener('dragleave', () => {
            uploadLabel.classList.remove('drag-over');
        });
        uploadLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadLabel.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (!file) return;
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            fileInput.dispatchEvent(new Event('change'));
        });

        compressBtn.addEventListener('click',   () => run('compress'));
        decompressBtn.addEventListener('click', () => run('decompress'));

        async function run(operation) {
            const file = fileInput.files[0];
            if (!file) {
                statusDiv.textContent = 'Please select a file first.';
                return;
            }
            statusDiv.textContent = operation === 'compress'
                ? 'Compressing...'
                : 'Decompressing...';
            resultDiv.innerHTML = '';

            try {
                // Build request body: JSON header line + raw binary bytes (no base64)
                const headerStr   = JSON.stringify({ service: 3, operation: operation, filename: file.name }) + '\n';
                const headerBytes = new TextEncoder().encode(headerStr);
                const fileBytes   = new Uint8Array(await file.arrayBuffer());

                const body = new Uint8Array(headerBytes.length + fileBytes.length);
                body.set(headerBytes, 0);
                body.set(fileBytes, headerBytes.length);

                const res = await fetch('/api/stream', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body:    body
                });

                if (!res.ok) {
                    statusDiv.textContent = 'Server error (' + res.status + '): ensure the server is running the latest build.';
                    console.error(await res.text());
                    return;
                }

                // Error response comes back as JSON
                const ct = res.headers.get('Content-Type') || '';
                if (ct.includes('application/json')) {
                    const err = await res.json();
                    statusDiv.textContent = 'Error: ' + (err.message || 'Unknown error');
                    return;
                }

                // Success: raw binary response — extract filename from Content-Disposition
                let outName = file.name;
                const cd = res.headers.get('Content-Disposition');
                if (cd) {
                    const m = cd.match(/filename="([^"]+)"/);
                    if (m) outName = m[1];
                }

                const blob = await res.blob();
                const url  = URL.createObjectURL(blob);

                statusDiv.textContent = operation === 'compress'
                    ? 'Compression complete!'
                    : 'Decompression complete!';

                resultDiv.innerHTML =
                    '<a href="' + url + '" download="' + outName + '" ' +
                    'style="color:#9966cc;font-family:\'Courier New\',monospace;font-size:13px;">' +
                    'Download ' + outName + '</a>';

                const a = document.createElement('a');
                a.href = url; a.download = outName; a.click();

            } catch (e) {
                statusDiv.textContent = e instanceof TypeError
                    ? 'Network error: could not reach the server. Make sure the server is running.'
                    : 'Unexpected error: ' + e.message;
            }
        }
    </script>

</body>

</html>
